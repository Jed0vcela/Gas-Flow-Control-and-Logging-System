; PlatformIO Project Configuration File

[env:rpipico]
platform = raspberrypi
board = rpipico
framework = picosdk
upload_protocol = picotool

; USB CDC for printf, monitor connects on the same USB cable as upload
monitor_speed = 115200
monitor_eol = CR

build_flags =
    -D LIB_PICO_STDIO_USB=1                         ; enable USB CDC stdio (printf)
    -D LIB_PICO_STDIO_UART=0                        ; keep both UARTs free for MFCs
    -D PICO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=0     ; don't stall at boot
    -D PICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=0  ; don't reboot into BOOTSEL on port open

; hardware_flash required for flash_range_erase / flash_range_program
; pico_multicore required for core1 USB scanner
lib_deps =
    hardware_flash
    hardware_sync
    pico_multicore